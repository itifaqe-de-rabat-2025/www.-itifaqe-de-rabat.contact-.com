<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itifaqe de Rabat | نادي اتفاق الرباط</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121814;
            color: #ffffff;
        }
        /* Header / الشريط العلوي */
        header {
            background-color: #1a231e;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #16a34a;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            height: 50px;
            width: auto;
        }
        .logo-text {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
        }
        .logo-text span {
            color: #16a34a;
        }
        nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-right: 20px;
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover {
            color: #16a34a;
        }
        /* Hero Section / الواجهة الرئيسية */
        .hero {
            text-align: center;
            padding: 90px 20px;
            background: linear-gradient(rgba(18, 24, 20, 0.85), rgba(18, 24, 20, 0.95)), 
                        url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200') center/cover;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .hero p {
            font-size: 18px;
            color: #9ca3af;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #16a34a;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #15803d;
        }
        /* Match Section / قسم المباريات */
        .match-card {
            background-color: #1a231e;
            max-width: 600px;
            margin: -35px auto 50px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #2e3d34;
        }
        .team {
            font-weight: bold;
            font-size: 18px;
        }
        .vs {
            background: #16a34a;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        /* Footer / التذييل */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #0b0f0d;
            color: #6b7280;
            font-size: 14px;
            border-top: 1px solid #1f2923;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="شعار اتفاق الرباط" class="logo-img">
            <div class="logo-text">Itifaqe <span>Rabat</span></div>
        </div>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#">الأخبار</a>
            <a href="#">الفريق</a>
            <a href="#">المباريات</a>
            <a href="#">تواصل معنا</a>
        </nav>
    </header>

    <!-- الواجهة الرئيسية -->
    <section class="hero">
        <h1>نادي اتفاق الرباط</h1>
        <p>الموقع الرسمي لنادي Itifaqe de Rabat - العزيمة والإصرار نحو القمة</p>
        <a href="#" class="btn">اكتشف جديد النادي</a>
    </section>

    <!-- كارت المباراة القادمة -->
    <div class="match-card">
        <div class="team">اتفاق الرباط</div>
        <div class="vs">المباراة القادمة</div>
        <div class="team">الفريق المنافس</div>
    </div>

    <!-- التذييل -->
    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - Itifaqe de Rabat</p>
    </footer>

</body>
</html>
